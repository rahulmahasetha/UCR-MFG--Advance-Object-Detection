model:
  backbone: "resnet50"
  pretrained: true
  freeze_bn: true          # batch size 2 -> keep pretrained BatchNorm statistics fixed
  frozen_stages: 1         # freeze stem + layer1 (standard detector fine-tuning)
  fpn_channels: 256
  graph_dim: 64
  strides: [8, 16, 32]
  uncertainty:
    dropout_rate: 0.2
    mc_passes: 10
    sigma_0_sq: 1.0
  graph:
    r_local: 2             # 3 doubles candidate edges; needs > 16 GB to avoid swapping at 1024 px
    k_feat: 8
    alpha: 1.0
    block_size: 32
  router:
    enabled: true          # ablation: false keeps every candidate edge (MFG-YOLO-style dense graph)
    use_uncertainty: true  # ablation: false removes Ua/Ue from scoring and budgets
    k_local: 4
    k_feat: 2
    k_cross: 2
    k_gain: 2.0            # extra edges per type for a maximally uncertain receiver
    hidden_dim: 64
  mpnn:
    benefit_gate: true     # ablation: false sets g_ij = 1
  fusion:
    mode: "residual"       # Z = F + (1 - lambda) * H; stored in every checkpoint so eval rebuilds the same model
    stage3_residual: 0.1
loss:
  lambda_u: 0.5
  lambda_var: 0.5
  lambda_graph: 0.1
  lambda_inst: 0.2
  lambda_benefit: 0.2
  lambda_consistency: 0.0   # off: its gradient was 2-4x the detection gradient on the graph modules and raised loss_cls 4x in stage 4
  benefit_step_interval: 2
  benefit_quantile: 0.75
  router_pos_weight: 3.0
inference:
  score_thresh: 0.05
  pre_nms_topk: 1000
  nms_iou: 0.6
  max_dets: 500
