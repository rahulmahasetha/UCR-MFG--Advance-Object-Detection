dataset_name: "UAVDT"
root_dir: "dataset/UAVDT-Benchmark-M"
annotation_format: "HBB"
splits:
  attr_dir: "M_attr"
  images_dir: "UAV-benchmark-M"
  gt_dir: "UAV-benchmark-MOTD_v1.0/GT"
  train_sequences: 30
  test_sequences: 20
classes:
  num_classes: 3
  names:
    - "car"
    - "truck"
    - "bus"
  coco_class_ids: [3, 8, 6]   # torchvision COCO indices for car, truck, bus (classifier init)
  mapping_from_visdrone:
    4: 0  # car -> car
    5: 0  # van -> car
    6: 1  # truck -> truck
    9: 2  # bus -> bus
image_size: [544, 1024]   # (H, W) native 1024x540 frames; same canvas as training (eval.py reads this)
evaluation:
  metric: "mAP@[.5:.95]"   # COCO-style, as reported in the paper (AP50 also reported)
  max_dets: 500

