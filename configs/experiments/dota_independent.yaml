experiment_name: "ucr_mfg_dota_independent"
mode: "independent_experiment"
dataset_config: "configs/datasets/dota_v1_5.yaml"
model_config: "configs/model/default.yaml"
train:
  max_epochs: 100
  batch_size: 2
  accumulate_grad_batches: 2
  max_images: 200          # fixed random subset of the train split; null = use all images
  classes: 16
  hbb_conversion: true
  optimizer: "AdamW"
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: "CosineAnnealingLR"
  stages:                  # same 20/20/20/40 % split as visdrone_primary
    stage_1:
      epochs: [1, 20]
      active_modules: ["backbone", "fpn", "unc_head", "det_head"]
      losses: ["det", "unc"]
    stage_2:
      epochs: [21, 40]
      active_modules: ["graph_builder"]
      losses: ["det", "unc", "graph"]
    stage_3:
      epochs: [41, 60]
      active_modules: ["router"]
      losses: ["det", "unc", "graph", "inst", "benefit"]
    stage_4:
      epochs: [61, 100]
      active_modules: ["mpnn", "fusion"]
      losses: ["all"]
val:
  interval: 5
  batch_size: 2
  max_images: 100          # fixed random subset of the validation split; null = use all images
  max_batches: null
checkpoint:
  save_dir: "checkpoints/dota_independent"
  save_every_steps: 50
  save_latest: true
  save_best: true
  keep_last_n: 3
