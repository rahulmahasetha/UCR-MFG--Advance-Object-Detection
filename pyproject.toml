[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ucr-mfg"
version = "0.1.0"
description = "Uncertainty-Conditioned Relational Routing for Multi-Scale Fuzzy Graph Object Detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

